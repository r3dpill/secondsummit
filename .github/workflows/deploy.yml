# Build and deploy to Cloudflare Pages on every push to main.
#
# This is what makes field posting work end to end: /post commits a post to
# this repo, that push lands here, and the site rebuilds and deploys without
# anyone touching a dashboard.
#
# Deploys are serialised — if two posts are filed in quick succession the
# second waits rather than racing the first, so the newer build always wins.

name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
  # /snowdonia-way flips from its teaser state to live mode on the expedition
  # start date, and that date is read at build time. A static site does not
  # notice a date passing, so rebuild once a day — otherwise the page would
  # sit in teaser mode until someone happened to push.
  schedule:
    - cron: '17 5 * * *'

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run check

      - name: Build
        run: npm run build

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler pages deploy dist \
            --project-name=secondsummit \
            --branch=main \
            --commit-hash="$GITHUB_SHA"
